<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Report | Encore × GovCon Giants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #F0592D;
      --brand-600: #D9491F;
      --brand-100: #FFEDD5;
      --brand-50: #FFF7ED;
      --ink: #1E293B;
      --ink-strong: #0F172A;
      --muted: #64748B;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-soft: #F1F5F9;
      --border: #E2E8F0;
      --green: #059669;
      --red: #DC2626;
      --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
      --shadow-lg: 0 10px 30px rgba(15,23,42,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 1.5rem 4rem; }
    a { color: var(--brand-600); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Top brand bar */
    .brandbar { background: var(--surface); border-bottom: 1px solid var(--border); }
    .brandbar-inner { max-width: 1180px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brandbar img { height: 30px; width: auto; display: block; }
    .brandbar .partner { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }

    /* Navigation */
    .top-nav { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin: 1.75rem 0 1.5rem; flex-wrap: wrap; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.1rem; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 0.85rem; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none; transition: all 0.18s;
      box-shadow: var(--shadow);
    }
    .nav-btn:hover { border-color: var(--brand); color: var(--brand-600); text-decoration: none; }
    .nav-btn.disabled { opacity: 0.4; pointer-events: none; box-shadow: none; }

    header { padding: 0 0 1.5rem; }
    header .eyebrow { display: inline-block; background: var(--brand-100); color: var(--brand-600); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.3rem 0.8rem; border-radius: 999px; margin-bottom: 0.85rem; }
    header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; color: var(--ink-strong); margin-bottom: 0.2rem; }
    header p { color: var(--muted); font-size: 1rem; }

    /* Metrics */
    .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 1rem; margin: 1.75rem 0; }
    .metric-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem 1.35rem; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .metric-box::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand); }
    .metric-box .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
    .metric-box .value { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-strong); margin-top: 0.25rem; line-height: 1; }
    .metric-box .delta { margin-top: 0.45rem; font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .delta.up { color: var(--green); }
    .delta.down { color: var(--red); }

    /* Trend charts */
    .section { margin: 2.25rem 0; }
    .section h2 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-strong); margin-bottom: 1rem; }
    .controls-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.5rem 0 1.25rem; }
    .pill { padding: 0.45rem 1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; font-family: inherit; transition: all 0.15s; }
    .pill:hover { border-color: var(--brand); color: var(--brand-600); }
    .pill.active { border-color: var(--brand); background: var(--brand); color: #fff; }
    .charts-grid { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 1rem; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.35rem 1.5rem; overflow: hidden; box-shadow: var(--shadow); }
    .chart-card h3 { font-size: 0.95rem; font-weight: 700; color: var(--ink-strong); margin-bottom: 0.85rem; }
    .chart-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.6rem; }
    .bar-list { display: grid; gap: 0.7rem; }
    .bar-row { display: grid; grid-template-columns: 92px 1fr 84px; gap: 0.75rem; align-items: center; }
    .bar-row .name { font-size: 0.85rem; color: var(--ink); font-weight: 500; }
    .bar-track { height: 14px; background: var(--surface-soft); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--brand); }
    .bar-val { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--muted); }
    .empty-msg { padding: 2rem; text-align: center; color: var(--muted); }

    /* ── Category Sections ── */
    .cat-section { margin: 2.5rem 0; }
    .cat-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding-bottom: 0.75rem; margin-bottom: 1.25rem;
      border-bottom: 2px solid var(--border);
    }
    .cat-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .cat-title { font-size: 1.1rem; font-weight: 800; color: var(--ink-strong); }
    .cat-total {
      margin-left: auto; font-size: 0.82rem; color: var(--muted); font-weight: 500;
    }

    /* Cards grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1rem;
    }

    /* Content card */
    .content-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    }
    .content-card:hover {
      border-color: var(--brand);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    /* Thumbnail area */
    .card-thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--surface-soft); }
    .card-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
    }
    .card-play-badge {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(15,23,42,0.78); border-radius: 6px;
      padding: 2px 7px; font-size: 0.65rem; color: #fff; font-weight: 600;
    }

    /* Card body */
    .card-body { padding: 0.9rem 1rem 1rem; }
    .card-channel-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; }
    .card-badge {
      display: inline-block; padding: 0.18rem 0.5rem;
      border-radius: 6px; font-size: 0.68rem; font-weight: 700;
    }
    .badge-youtube { background: #FEE2E2; color: #DC2626; }
    .badge-linkedin { background: #DBEAFE; color: #0A66C2; }
    .badge-instagram { background: #FCE7F3; color: #C026D3; }
    .badge-fhc { background: var(--brand-100); color: var(--brand-600); }
    .badge-podcast { background: #D1FAE5; color: #059669; }
    .card-type { font-size: 0.72rem; color: var(--muted); }

    .card-title {
      font-size: 0.88rem; font-weight: 700; line-height: 1.4; color: var(--ink-strong);
      margin-bottom: 0.65rem;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-title.untitled { font-style: italic; font-weight: 500; color: var(--muted); }

    .card-stats { display: flex; flex-wrap: wrap; gap: 0.8rem; }
    .card-stat { display: flex; flex-direction: column; }
    .cs-val { font-size: 0.95rem; font-weight: 800; color: var(--ink-strong); }
    .cs-lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }

    /* ── Preview Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; max-width: 560px; width: 100%;
      max-height: 90vh; overflow-y: auto; position: relative;
      box-shadow: 0 20px 60px rgba(15,23,42,0.25);
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close-btn {
      position: absolute; top: 0.9rem; right: 0.9rem;
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 1.1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 2; line-height: 1; transition: all 0.15s; box-shadow: var(--shadow);
    }
    .modal-close-btn:hover { border-color: var(--brand); color: var(--brand-600); }

    /* Modal YouTube thumbnail with play button */
    .modal-yt-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9;
      border-radius: 20px 20px 0 0; overflow: hidden; background: #000;
    }
    .modal-yt-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .modal-yt-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.2); text-decoration: none;
      transition: background 0.15s;
    }
    .modal-yt-overlay:hover { background: rgba(0,0,0,0.05); }
    .play-circle {
      width: 64px; height: 64px; background: var(--brand);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    /* Modal icon placeholder */
    .modal-icon-wrap {
      width: 100%; padding: 2.5rem 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 20px 20px 0 0; font-size: 3.5rem;
    }

    /* Modal body */
    .modal-body { padding: 1.35rem 1.6rem 1.6rem; }
    .modal-channel-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
    .modal-title { font-size: 1.2rem; font-weight: 800; line-height: 1.35; color: var(--ink-strong); margin-bottom: 0.35rem; }
    .modal-date { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.15rem; }

    .modal-stats-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem; margin-bottom: 1.3rem;
    }
    .modal-stat-box {
      background: var(--surface-soft); border-radius: 12px;
      padding: 0.7rem 1rem;
    }
    .msb-lbl { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
    .msb-val { font-size: 1.25rem; font-weight: 800; color: var(--ink-strong); margin-top: 0.15rem; }

    .modal-link-btn {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.75rem 1.5rem; border-radius: 999px;
      background: var(--brand); color: #fff;
      text-decoration: none; font-size: 0.9rem; font-weight: 700;
      transition: background 0.2s; border: none; cursor: pointer; font-family: inherit;
    }
    .modal-link-btn:hover { background: var(--brand-600); text-decoration: none; }

    /* Export row */
    .content-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .content-toolbar h2 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-strong); padding-bottom: 0; border-bottom: none; margin-bottom: 0; }
    .export-btn {
      padding: 0.5rem 1.1rem; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 0.82rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow);
    }
    .export-btn:hover { border-color: var(--brand); color: var(--brand-600); }

    footer {
      text-align: center; padding: 2.5rem 0 0; margin-top: 2.5rem;
      border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem;
    }
    footer img { height: 22px; width: auto; vertical-align: middle; opacity: 0.85; margin: 0 0.4rem; }

    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) {
      .container { padding: 0 1rem 3rem; }
      header h1 { font-size: 1.7rem; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .modal-stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) { .cards-grid { grid-template-columns: 1fr; } }
    @media print {
      body { background: white; }
      .top-nav, .export-btn { display: none; }
      .metric-box, .chart-card, .content-card { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="brandbar">
    <div class="brandbar-inner">
      <a href="Encore_Report.html"><img src="images/EncoreLogo_Primary_Color_CMYK.png" alt="Encore Funding" /></a>
      <span class="partner">GovCon Giants Partnership</span>
    </div>
  </div>

  <div class="container">
    <div class="top-nav" id="top-nav"></div>

    <header>
      <span class="eyebrow">Monthly Report</span>
      <h1 id="month-title">Monthly Report</h1>
      <p id="month-subtitle">Encore Funding × GovCon Giants Partnership</p>
    </header>

    <div id="metrics" class="metrics-row"></div>

    <div id="ga-month-section"></div>

    <div class="section">
      <h2>Month-to-month performance</h2>
      <div class="controls-row" id="metric-pills"></div>
      <div class="charts-grid">
        <div class="chart-card">
          <h3 id="trend-title">Trend</h3>
          <div id="trend-chart"></div>
          <div class="chart-sub">Selected month is highlighted. Use the pills to switch the metric.</div>
        </div>
        <div class="chart-card">
          <h3 id="mix-title">Channel mix (selected month)</h3>
          <div class="bar-list" id="channel-bars"></div>
        </div>
      </div>
    </div>

    <!-- Category sections -->
    <div id="category-sections"></div>

    <footer>
      <div>
        <img src="images/EncoreLogo_Primary_Color_CMYK.png" alt="Encore Funding" />
        <img src="images/GovconGiants-logo-black.png" alt="GovCon Giants" />
      </div>
      <div style="margin-top:0.75rem">Encore Funding &times; GovCon Giants Partnership Report</div>
    </footer>
  </div>

  <!-- Preview Modal -->
  <div id="preview-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close-btn" id="modal-close" aria-label="Close">&#x2715;</button>
      <div id="modal-inner"></div>
    </div>
  </div>

  <script src="report-data.js"></script>
  <script src="ga-data.js"></script>
  <script>
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function monthLabel(key) {
      const [y, m] = key.split('-');
      return MONTHS[parseInt(m, 10) - 1] + ' ' + y;
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return iso;
      return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    }

    function fmtN(v) { return v != null ? Number(v).toLocaleString() : '—'; }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDelta(cur, prev) {
      if (prev == null || prev === 0) return { text: '—', cls: '' };
      const diff = cur - prev;
      const pct = (diff / prev) * 100;
      const sign = diff > 0 ? '+' : '';
      return { text: sign + diff.toLocaleString() + ' (' + sign + pct.toFixed(1) + '%)', cls: diff > 0 ? 'up' : diff < 0 ? 'down' : '' };
    }

    function getYouTubeId(url) {
      if (!url) return null;
      const pats = [/youtu\.be\/([A-Za-z0-9_-]{11})/, /[?&]v=([A-Za-z0-9_-]{11})/, /\/video\/([A-Za-z0-9_-]{11})/, /\/embed\/([A-Za-z0-9_-]{11})/];
      for (const re of pats) { const m = url.match(re); if (m) return m[1]; }
      return null;
    }

    function svgLineChart({ months, values, selectedIndex, width = 760, height = 220 }) {
      const pad = { l: 36, r: 16, t: 12, b: 28 };
      const innerW = width - pad.l - pad.r, innerH = height - pad.t - pad.b;
      const maxV = Math.max(...values, 1), minV = Math.min(...values, 0);
      const range = Math.max(maxV - minV, 1);
      const x = i => pad.l + (innerW * (values.length === 1 ? 0 : i / (values.length - 1)));
      const y = v => pad.t + innerH - (innerH * ((v - minV) / range));
      const pts = values.map((v, i) => x(i) + ',' + y(v)).join(' ');
      const areaPts = pts + ' ' + x(values.length - 1) + ',' + (height - pad.b) + ' ' + x(0) + ',' + (height - pad.b);
      const circles = values.map((v, i) => {
        const sel = i === selectedIndex;
        return '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (sel ? 5 : 3) + '" fill="' + (sel ? '#F0592D' : '#fff') + '" stroke="#F0592D" stroke-width="' + (sel ? 0 : 2) + '"><title>' + monthLabel(months[i]) + ': ' + (v||0).toLocaleString() + '</title></circle>';
      }).join('');
      const xLabels = values.map((v, i) => '<text x="' + x(i) + '" y="' + (height-10) + '" text-anchor="middle" font-size="10" fill="#64748B">' + MONTHS[parseInt(months[i].split('-')[1],10)-1] + '</text>').join('');
      const selX = selectedIndex >= 0 ? x(selectedIndex) : -999;
      const selLine = selectedIndex >= 0 ? '<line x1="' + selX + '" y1="' + pad.t + '" x2="' + selX + '" y2="' + (height-pad.b) + '" stroke="#E2E8F0" stroke-dasharray="4 4" />' : '';
      return '<svg viewBox="0 0 ' + width + ' ' + height + '" width="100%" height="' + height + '">' +
        '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0592D" stop-opacity="0.18"/><stop offset="100%" stop-color="#F0592D" stop-opacity="0"/></linearGradient></defs>' +
        selLine + '<polygon points="' + areaPts + '" fill="url(#areaGrad)" />' +
        '<polyline points="' + pts + '" fill="none" stroke="#F0592D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />' + circles + xLabels + '</svg>';
    }

    // ── Setup ──
    const params = new URLSearchParams(location.search);
    const monthKey = params.get('month') || '';
    const data = window.REPORT_DATA || { months: [], items: [], aggregates: {}, series: {} };
    const allMonths = data.months || [];

    if (!monthKey || !allMonths.includes(monthKey)) { location.href = 'Encore_Report.html'; throw new Error('redirect'); }

    const idx = allMonths.indexOf(monthKey);
    const prevMonthKey = idx > 0 ? allMonths[idx - 1] : null;
    const nextMonthKey = idx < allMonths.length - 1 ? allMonths[idx + 1] : null;

    // ── Nav ──
    document.getElementById('top-nav').innerHTML =
      (prevMonthKey ? '<a href="monthly-report.html?month=' + prevMonthKey + '" class="nav-btn">&larr; ' + monthLabel(prevMonthKey) + '</a>' : '<span class="nav-btn disabled">&larr; Prev</span>') +
      '<a href="Encore_Report.html" class="nav-btn">All Reports</a>' +
      '<a href="executive-summary.html?month=' + monthKey + '" class="nav-btn" style="border-color:var(--brand);color:var(--brand-600)">★ Executive Summary</a>' +
      (nextMonthKey ? '<a href="monthly-report.html?month=' + nextMonthKey + '" class="nav-btn">' + monthLabel(nextMonthKey) + ' &rarr;</a>' : '<span class="nav-btn disabled">Next &rarr;</span>');

    document.getElementById('month-title').textContent = monthLabel(monthKey) + ' Report';
    document.title = monthLabel(monthKey) + ' Report | Encore × GovCon Giants';

    // ── KPIs ──
    const curAgg = (data.aggregates && data.aggregates[monthKey]) || { totals: {}, by_channel: {} };
    const prevAgg = prevMonthKey && data.aggregates && data.aggregates[prevMonthKey] || null;
    const totals = curAgg.totals || {};
    const prevTotals = prevAgg ? prevAgg.totals || {} : null;
    const isEmpty = (totals.items || 0) === 0;
    const byCh = curAgg.by_channel || {};

    const deltas = {
      impressions: prevTotals ? fmtDelta(totals.impressions||0, prevTotals.impressions||0) : {text:'—',cls:''},
      views: prevTotals ? fmtDelta(totals.views||0, prevTotals.views||0) : {text:'—',cls:''},
      engagements: prevTotals ? fmtDelta(totals.engagements||0, prevTotals.engagements||0) : {text:'—',cls:''},
      clicks: prevTotals ? fmtDelta(totals.clicks||0, prevTotals.clicks||0) : {text:'—',cls:''},
    };

    let metricsHTML =
      '<div class="metric-box"><div class="label">Pieces Published</div><div class="value">' + (totals.items||0) + '</div><div class="delta">vs prev: ' + (prevTotals ? prevTotals.items||0 : '—') + '</div></div>' +
      '<div class="metric-box"><div class="label">Impressions</div><div class="value">' + (totals.impressions||0).toLocaleString() + '</div><div class="delta ' + deltas.impressions.cls + '">' + deltas.impressions.text + '</div></div>' +
      '<div class="metric-box"><div class="label">Views</div><div class="value">' + (totals.views||0).toLocaleString() + '</div><div class="delta ' + deltas.views.cls + '">' + deltas.views.text + '</div></div>' +
      '<div class="metric-box"><div class="label">Engagements</div><div class="value">' + (totals.engagements||0).toLocaleString() + '</div><div class="delta ' + deltas.engagements.cls + '">' + deltas.engagements.text + '</div></div>' +
      '<div class="metric-box"><div class="label">Clicks</div><div class="value">' + (totals.clicks||0).toLocaleString() + '</div><div class="delta ' + deltas.clicks.cls + '">' + deltas.clicks.text + '</div></div>';

    const webinarChats = (byCh.FHC||{}).chat_count||0;
    if ((totals.attendees||0) > 0 || webinarChats > 0)
      metricsHTML += '<div class="metric-box"><div class="label">Webinar Attendees</div><div class="value">' + (totals.attendees||0) + '</div><div class="delta">' + webinarChats + ' chat messages</div></div>';
    if ((totals.email_sends||0) > 0)
      metricsHTML += '<div class="metric-box"><div class="label">Email Sends</div><div class="value">' + (totals.email_sends||0).toLocaleString() + '</div><div class="delta">Newsletter distribution</div></div>';
    if ((totals.article_views||0) > 0)
      metricsHTML += '<div class="metric-box"><div class="label">Article Reads</div><div class="value">' + (totals.article_views||0).toLocaleString() + '</div><div class="delta">LinkedIn articles</div></div>';
    const podcastData = byCh.Podcast || {};
    if ((podcastData.impressions||0) > 0)
      metricsHTML += '<div class="metric-box"><div class="label">Podcast Downloads</div><div class="value">' + (podcastData.impressions||0).toLocaleString() + '</div><div class="delta">' + (podcastData.views > 0 ? podcastData.views.toLocaleString() + ' listeners' : 'Total downloads') + '</div></div>';

    if (isEmpty) metricsHTML = '<div class="metric-box" style="grid-column:1/-1;text-align:center"><div class="label">Status</div><div class="value" style="font-size:1rem">No content published this month</div></div>';
    document.getElementById('metrics').innerHTML = metricsHTML;

    // ── Website traffic for this month (Google Analytics) ──
    (function renderGaMonth() {
      const ga = window.GA_DATA;
      if (!ga || !ga.monthly) return;
      const gm = ga.monthly.months || [];
      const gi = gm.indexOf(monthKey);
      if (gi < 0) return;

      const newU = (ga.monthly.new_users || [])[gi] || 0;
      const actU = (ga.monthly.active_users || [])[gi] || 0;
      if (newU === 0 && actU === 0) return;

      const prevNew = gi > 0 ? (ga.monthly.new_users || [])[gi - 1] || 0 : null;
      const totalNew = (ga.monthly.new_users || []).reduce((s, v) => s + (v || 0), 0);
      const share = totalNew ? ((newU / totalNew) * 100).toFixed(1) + '% of period' : '';
      const d = prevNew != null ? fmtDelta(newU, prevNew) : { text: '—', cls: '' };

      document.getElementById('ga-month-section').innerHTML =
        '<div class="section"><h2>Website traffic <span style="font-size:0.8rem;font-weight:500;color:var(--muted)">· Google Analytics (gov.encore-funding.com)</span></h2>' +
        '<div class="metrics-row">' +
          '<div class="metric-box"><div class="label">New Site Users</div><div class="value">' + newU.toLocaleString() + '</div><div class="delta ' + d.cls + '">' + d.text + '</div></div>' +
          '<div class="metric-box"><div class="label">Total Site Users</div><div class="value">' + actU.toLocaleString() + '</div><div class="delta">' + share + '</div></div>' +
        '</div>' +
        '<div class="chart-sub" style="margin-top:0.5rem">Channel, page, and conversion detail is available period-wide on the main dashboard\u2019s Website Analytics tab.</div>' +
        '</div>';
    })();

    // ── Trend Charts ──
    const metricDefs = [
      { key: 'impressions', label: 'Impressions' },
      { key: 'views', label: 'Views' },
      { key: 'engagements', label: 'Engagements' },
      { key: 'clicks', label: 'Clicks' },
    ];
    let selectedMetric = 'impressions';
    const pills = document.getElementById('metric-pills');
    pills.innerHTML = metricDefs.map(m => '<button class="pill ' + (m.key === selectedMetric ? 'active' : '') + '" data-m="' + m.key + '">' + m.label + '</button>').join('');

    function renderCharts() {
      const seriesValues = (data.series && data.series[selectedMetric]) ? data.series[selectedMetric] : allMonths.map(() => 0);
      document.getElementById('trend-title').textContent = 'Trend: ' + metricDefs.find(m => m.key === selectedMetric).label;
      document.getElementById('trend-chart').innerHTML = svgLineChart({ months: allMonths, values: seriesValues, selectedIndex: idx });
      const rows = Object.keys(byCh).map(ch => ({ ch, v: byCh[ch][selectedMetric]||0 })).sort((a,b) => b.v-a.v);
      const maxV = Math.max(...rows.map(r=>r.v), 1);
      document.getElementById('channel-bars').innerHTML = rows.length
        ? rows.map(r => '<div class="bar-row"><div class="name">' + r.ch + '</div><div class="bar-track"><div class="bar-fill" style="width:' + ((r.v/maxV)*100).toFixed(1) + '%"></div></div><div class="bar-val">' + r.v.toLocaleString() + '</div></div>').join('')
        : '<div class="empty-msg">No channel data.</div>';
    }
    pills.querySelectorAll('button[data-m]').forEach(b => {
      b.addEventListener('click', () => {
        selectedMetric = b.dataset.m;
        pills.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        b.classList.add('active');
        renderCharts();
      });
    });
    renderCharts();

    // ── Category Config ──
    const CATEGORIES = [
      {
        id: 'video',
        label: 'YouTube Videos',
        icon: '▶',
        iconBg: '#FEE2E2',
        iconColor: '#DC2626',
        filter: it => it.channel === 'Youtube',
      },
      {
        id: 'social',
        label: 'Social Media',
        icon: '◆',
        iconBg: '#DBEAFE',
        iconColor: '#0A66C2',
        filter: it => (it.channel === 'LinkedIn' && it.type !== 'Article') || it.channel === 'Instagram',
      },
      {
        id: 'webinar',
        label: 'Webinars',
        icon: '◉',
        iconBg: '#FFEDD5',
        iconColor: '#D9491F',
        filter: it => it.channel === 'FHC',
      },
      {
        id: 'podcast',
        label: 'Podcast',
        icon: '♪',
        iconBg: '#D1FAE5',
        iconColor: '#059669',
        filter: it => it.channel === 'Podcast',
      },
      {
        id: 'newsletter',
        label: 'Articles & Newsletter',
        icon: '✉',
        iconBg: '#FEF3C7',
        iconColor: '#D97706',
        filter: it => it.channel === 'LinkedIn' && it.type === 'Article',
      },
    ];

    const CH_BADGE = {
      Youtube: 'badge-youtube', LinkedIn: 'badge-linkedin',
      Instagram: 'badge-instagram', FHC: 'badge-fhc', Podcast: 'badge-podcast',
    };

    // Placeholder config per channel
    const PLACEHOLDER = {
      LinkedIn: { bg: '#DBEAFE', color: '#0A66C2', icon: 'in' },
      Instagram: { bg: '#FCE7F3', color: '#C026D3', icon: '◆' },
      FHC: { bg: '#FFEDD5', color: '#D9491F', icon: '◉' },
      Podcast: { bg: '#D1FAE5', color: '#059669', icon: '♪' },
    };

    function cardThumbHTML(item) {
      if (item.channel === 'Youtube') {
        const id = getYouTubeId(item.link);
        if (id) {
          return '<div class="card-thumb-wrap">' +
            '<img class="card-thumb" src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">' +
            '<div class="card-thumb-placeholder" style="display:none;background:#FEE2E2;color:#DC2626;position:absolute;inset:0">▶</div>' +
            '<div class="card-play-badge">▶ Watch</div>' +
            '</div>';
        }
      }
      const cfg = PLACEHOLDER[item.channel] || { bg: '#FFEDD5', color: '#D9491F', icon: '◆' };
      return '<div class="card-thumb-wrap"><div class="card-thumb-placeholder" style="background:' + cfg.bg + ';color:' + cfg.color + '">' + cfg.icon + '</div></div>';
    }

    function cardStatsHTML(item) {
      const stats = [];
      if (item.channel === 'Youtube') {
        if (item.impressions != null) stats.push({ v: fmtN(item.impressions), l: 'Impr.' });
        if (item.views != null) stats.push({ v: fmtN(item.views), l: 'Views' });
      } else if (item.channel === 'Instagram') {
        const v = item.views != null ? item.views : item.impressions;
        if (v != null) stats.push({ v: fmtN(v), l: 'Views' });
        if (item.interactions != null) stats.push({ v: fmtN(item.interactions), l: 'Interactions' });
      } else if (item.channel === 'LinkedIn' && item.type !== 'Article') {
        if (item.impressions != null) stats.push({ v: fmtN(item.impressions), l: 'Impr.' });
        if (item.engagements != null) stats.push({ v: fmtN(item.engagements), l: 'Engagements' });
      } else if (item.channel === 'FHC') {
        if (item.attendees != null) stats.push({ v: fmtN(item.attendees), l: 'Attendees' });
        if (item.chat_count != null) stats.push({ v: fmtN(item.chat_count), l: 'Chats' });
      } else if (item.channel === 'Podcast') {
        const dl = item.views != null ? item.views : item.impressions;
        if (dl != null) stats.push({ v: fmtN(dl), l: 'Downloads' });
      } else if (item.type === 'Article') {
        if (item.email_sends != null) stats.push({ v: fmtN(item.email_sends), l: 'Email Sends' });
        if (item.article_views != null) stats.push({ v: fmtN(item.article_views), l: 'Reads' });
      }
      return stats.map(s => '<div class="card-stat"><span class="cs-val">' + s.v + '</span><span class="cs-lbl">' + s.l + '</span></div>').join('');
    }

    function buildCard(item, catId) {
      const badge = CH_BADGE[item.channel] || 'badge-fhc';
      const title = item.title || '';
      const titleClass = title ? 'card-title' : 'card-title untitled';
      const titleText = title || (item.channel === 'FHC' ? 'Webinar · ' + fmtDate(item.date_iso) : item.type || item.channel);

      return '<div class="content-card" data-item-idx="' + item._idx + '" tabindex="0" role="button" aria-label="Preview ' + esc(titleText) + '">' +
        cardThumbHTML(item) +
        '<div class="card-body">' +
          '<div class="card-channel-row">' +
            '<span class="card-badge ' + badge + '">' + item.channel + '</span>' +
            '<span class="card-type">' + (item.type || '') + '</span>' +
          '</div>' +
          '<div class="' + titleClass + '">' + esc(titleText) + '</div>' +
          '<div class="card-stats">' + cardStatsHTML(item) + '</div>' +
        '</div>' +
      '</div>';
    }

    // ── Category Sections ──
    function renderCategories() {
      const monthItems = data.items.filter(it => it.month === monthKey);

      if (monthItems.length === 0) {
        document.getElementById('category-sections').innerHTML = '<div class="empty-msg">No content recorded for this month.</div>';
        return;
      }

      // Tag each item with a stable index for modal lookup
      monthItems.forEach((it, i) => { it._idx = i; });

      // Export all
      function exportCSV() {
        const headers = ['Date','Channel','Type','Title','Impressions','Views','Engagements','Clicks','Attendees','Chats','Email Sends','Article Reads','Link'];
        const rows = monthItems.map(it => [
          it.date_iso||'', it.channel||'', it.type||'',
          '"' + (it.title||'').replace(/"/g,'""') + '"',
          it.impressions??'', it.views??'', it.engagements??'', it.clicks??'',
          it.attendees??'', it.chat_count??'', it.email_sends??'', it.article_views??'',
          it.link||''
        ].join(','));
        const csv = [headers.join(',')].concat(rows).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        a.download = 'encore-' + monthKey + '.csv';
        a.click();
      }

      let html = '<div class="section">' +
        '<div class="content-toolbar">' +
          '<h2>Activity this month</h2>' +
          '<button class="export-btn" id="export-btn">Export CSV</button>' +
        '</div>';

      CATEGORIES.forEach(cat => {
        const items = monthItems.filter(cat.filter);
        if (items.length === 0) return;

        const totalImpr = items.reduce((s, it) => s + (it.impressions||0), 0);
        const summaryText = totalImpr > 0 ? totalImpr.toLocaleString() + ' total impressions' : items.length + ' item' + (items.length > 1 ? 's' : '');

        html += '<div class="cat-section">' +
          '<div class="cat-header">' +
            '<div class="cat-icon" style="background:' + cat.iconBg + ';color:' + cat.iconColor + '">' + cat.icon + '</div>' +
            '<span class="cat-title">' + cat.label + '</span>' +
            '<span class="cat-total">' + items.length + ' piece' + (items.length > 1 ? 's' : '') + ' &nbsp;·&nbsp; ' + summaryText + '</span>' +
          '</div>' +
          '<div class="cards-grid">' +
            items.map(it => buildCard(it, cat.id)).join('') +
          '</div>' +
        '</div>';
      });

      html += '</div>';
      document.getElementById('category-sections').innerHTML = html;

      document.getElementById('export-btn').addEventListener('click', exportCSV);

      // Card click handlers
      document.querySelectorAll('.content-card').forEach(card => {
        const open = () => openModal(monthItems[parseInt(card.dataset.itemIdx)]);
        card.addEventListener('click', open);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
      });
    }

    // ── Modal ──
    function modalStatBox(label, value) {
      if (value == null || value === '—') return '';
      return '<div class="modal-stat-box"><div class="msb-lbl">' + label + '</div><div class="msb-val">' + value + '</div></div>';
    }

    function openModal(item) {
      const id = getYouTubeId(item.link);
      const title = item.title || (item.channel === 'FHC' ? 'Webinar' : item.type || item.channel);
      const badge = CH_BADGE[item.channel] || 'badge-fhc';
      const cfg = PLACEHOLDER[item.channel] || { bg: '#FFEDD5', color: '#D9491F', icon: '◆' };

      // Thumbnail / icon area
      let thumbHTML = '';
      if (item.channel === 'Youtube' && id) {
        thumbHTML = '<div class="modal-yt-wrap">' +
          '<img class="modal-yt-img" src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="">' +
          '<a href="' + esc(item.link) + '" target="_blank" rel="noopener" class="modal-yt-overlay">' +
            '<div class="play-circle">▶</div>' +
          '</a>' +
        '</div>';
      } else {
        thumbHTML = '<div class="modal-icon-wrap" style="background:' + cfg.bg + ';color:' + cfg.color + '">' + cfg.icon + '</div>';
      }

      // Stats boxes
      let statsHTML = '';
      if (item.channel === 'Youtube') {
        statsHTML = modalStatBox('Impressions', fmtN(item.impressions)) + modalStatBox('Views', fmtN(item.views)) + modalStatBox('Type', item.type||'—') + modalStatBox('Date', fmtDate(item.date_iso));
      } else if (item.channel === 'Instagram') {
        const v = item.views != null ? item.views : item.impressions;
        statsHTML = modalStatBox('Views', fmtN(v)) + modalStatBox('Interactions', fmtN(item.interactions)) + modalStatBox('Date', fmtDate(item.date_iso)) + modalStatBox('Type', item.type||'Post');
      } else if (item.channel === 'LinkedIn' && item.type !== 'Article') {
        statsHTML = modalStatBox('Impressions', fmtN(item.impressions)) + modalStatBox('Engagements', fmtN(item.engagements)) + modalStatBox('Clicks', fmtN(item.clicks)) + modalStatBox('Date', fmtDate(item.date_iso));
      } else if (item.channel === 'FHC') {
        statsHTML = modalStatBox('Attendees', fmtN(item.attendees)) + modalStatBox('Chat Messages', fmtN(item.chat_count)) + modalStatBox('Date', fmtDate(item.date_iso)) + modalStatBox('Type', 'Webinar');
      } else if (item.channel === 'Podcast') {
        const dl = item.views != null ? item.views : item.impressions;
        statsHTML = modalStatBox('Downloads', fmtN(dl)) + modalStatBox('Type', item.type||'Episode') + modalStatBox('Date', fmtDate(item.date_iso));
      } else if (item.type === 'Article') {
        statsHTML = modalStatBox('Email Sends', fmtN(item.email_sends)) + modalStatBox('Article Reads', fmtN(item.article_views)) + modalStatBox('Impressions', fmtN(item.impressions)) + modalStatBox('Engagements', fmtN(item.engagements));
      }

      // CTA label
      const ctaLabel = item.channel === 'Youtube' ? 'Watch on YouTube ↗' : item.channel === 'Podcast' ? 'Listen to Episode ↗' : item.channel === 'FHC' ? 'View on FHC ↗' : item.type === 'Article' ? 'Read Article ↗' : 'View Post ↗';
      const ctaHTML = item.link ? '<a href="' + esc(item.link) + '" target="_blank" rel="noopener" class="modal-link-btn">' + ctaLabel + '</a>' : '';

      document.getElementById('modal-inner').innerHTML =
        thumbHTML +
        '<div class="modal-body">' +
          '<div class="modal-channel-row">' +
            '<span class="card-badge ' + badge + '">' + item.channel + '</span>' +
            '<span style="font-size:0.82rem;color:var(--text-muted)">' + (item.type||'') + '</span>' +
          '</div>' +
          '<div class="modal-title">' + esc(title) + '</div>' +
          '<div class="modal-date">' + fmtDate(item.date_iso) + '</div>' +
          (statsHTML ? '<div class="modal-stats-grid">' + statsHTML + '</div>' : '') +
          ctaHTML +
        '</div>';

      document.getElementById('preview-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('preview-modal').style.display = 'none';
      document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('preview-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('preview-modal')) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    renderCategories();
  </script>
</body>
</html>
